[project]
name = "tradon"
version = "0.1.0"
description = "Multi-market signal trading bot core (Forex first, crypto later)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "websockets>=12.0",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
gui = [
    "pyside6>=6.7",
    "qasync>=0.27",
]
metatrader = [
    "MetaTrader5>=5.0; sys_platform == 'win32'",
]
ml = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
]
telegram = [
    "aiogram>=3.4",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
]

[project.scripts]
tradon = "tradon.cli.main:app"
tradon-gui = "tradon.gui.app:main"
tradon-telegram = "tradon.bots.telegram:main"
tradon-web = "tradon.web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
