<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tradon — Sign in</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0e14; color: #e6e6e6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  form { background: #151a24; padding: 2rem; border-radius: 8px; width: 280px; }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; font-weight: 600; }
  label { display: block; font-size: 0.85rem; margin: 0.75rem 0 0.25rem; color: #9aa4b2; }
  input { width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid #2a3240; background: #0b0e14; color: #e6e6e6; box-sizing: border-box; }
  button { margin-top: 1.25rem; width: 100%; padding: 0.6rem; border: 0; border-radius: 4px; background: #2e7d5b; color: white; font-weight: 600; cursor: pointer; }
  .error { color: #e05252; font-size: 0.85rem; margin-top: 0.5rem; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Tradon</h1>
  <label for="email">Login</label>
  <input id="email" type="text" name="email" required autofocus>
  <label for="password">Password</label>
  <input id="password" type="password" name="password" required>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <button type="submit">Sign in</button>
</form>
</body>
</html>
