name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # web/telegram are imported directly by their test modules (no
      # try/except guard like metatrader's), so they're required, not
      # optional, for the suite to even collect. gui (PySide6) and
      # metatrader (Windows-only, needs a running MT5 terminal) aren't
      # imported by any test and are skipped here on purpose.
      - name: Install dependencies
        run: pip install -e ".[dev,web,telegram,ml]"

      # data/ isn't committed (it's gitignored — it's the local SQLite
      # file, not source), so a fresh checkout has no DB and no schema.
      # README's own setup instructions have the same step; mirroring it
      # here is what actually exercises the migrations too, not just a
      # test-fixture workaround.
      - name: Apply database migrations
        run: |
          mkdir -p data
          alembic upgrade head

      - name: Run tests
        run: pytest -q
